services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sso_app_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sso_login
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
volumes:
  postgres_data:
  mongo_data:
