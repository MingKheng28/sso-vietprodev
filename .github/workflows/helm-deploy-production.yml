name: Helm Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. v1.0.0 or main-sha)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  HELM_FLAGS: '--timeout 10m --wait --create-namespace'

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sso.${{ secrets.PRODUCTION_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for production cluster
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Helm lint
        run: |
          helm lint infrastructure/helm/sso-api \
            --values infrastructure/helm/sso-api/values-prod.yaml \
            --values infrastructure/helm/sso-api/values.yaml

      - name: Create backup before deploy
        run: |
          echo "Backup verification: ${{ inputs.image_tag }}"
          kubectl -n sso-prod exec -it deployment/sso-api -- sh -c "echo pre-deploy-backup $(date)" || true

      - name: Deploy to Production
        run: |
          helm upgrade --install sso-api infrastructure/helm/sso-api \
            ${{ env.HELM_FLAGS }} \
            --namespace sso-prod \
            --values infrastructure/helm/sso-api/values-prod.yaml \
            --values infrastructure/helm/sso-api/values.yaml \
            --set image.repository=${{ env.REGISTRY }}/sso-api \
            --set image.tag=${{ inputs.image_tag }} \
            --set image.pullPolicy=IfNotPresent

      - name: Run migration job
        run: |
          kubectl -n sso-prod \
            rollout status deployment/sso-api-migration 2>/dev/null || true

      - name: Post-deploy smoke test
        run: |
          sleep 15
          curl -sf https://sso.${{ secrets.PRODUCTION_DOMAIN }}/health/live \
            || { echo "Health check failed"; exit 1; }

      - name: Verify OIDC discovery
        run: |
          curl -sf "https://sso.${{ secrets.PRODUCTION_DOMAIN }}/.well-known/openid-configuration" \
            | jq -e '.issuer' || { echo "OIDC discovery failed"; exit 1; }

      - name: Notify completion
        if: success()
        run: |
          echo "Production deploy of sso-api:${{ inputs.image_tag }} completed successfully"

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for production cluster
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Rollback to previous revision
        run: |
          helm rollback sso-api sso-prod --namespace sso-prod --wait --timeout 5m || true
          echo "Rollback initiated. Manual verification required."
