replicaCount: 2
image:
  repository: sso-api
  tag: 0.1.0
  pullPolicy: IfNotPresent
service:
  port: 80
ingress:
  enabled: false
  host: sso.example.com
env:
  NODE_ENV: production
  PORT: '3000'
secret:
  create: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
